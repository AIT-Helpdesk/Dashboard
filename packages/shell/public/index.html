<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ambient IT Dashboard</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Applies a saved light/dark choice before the stylesheet paints, so a
       user who's picked a theme different from their OS setting doesn't see
       a flash of the wrong one on load. Inline and synchronous (not part of
       app.js, which is a deferred module) is what makes that timing work. -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('dashboard.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
        // Same flash-avoidance reasoning as the theme read above -- applied
        // to <html> (available immediately, before <body> is even parsed),
        // not .sidebar, since that element doesn't exist yet at this point.
        if (localStorage.getItem('dashboard.sidebarCollapsed') === 'true') {
          document.documentElement.setAttribute('data-sidebar-collapsed', 'true');
        }
      } catch (e) {
        // localStorage unavailable (private browsing, storage full, etc.) -- falls back to the OS setting / expanded sidebar.
      }
    })();
  </script>
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <img src="logo.png" alt="Ambient iT" class="sidebar-logo" />
      <div class="sidebar-toggle-row">
        <button id="sidebar-toggle" class="sidebar-toggle" type="button"></button>
        <button id="sidebar-pin-toggle" class="sidebar-toggle sidebar-pin-toggle" type="button">📌</button>
      </div>
      <ul id="nav-list" class="nav-list"></ul>
      <div id="user-info" class="user-info"></div>
      <button id="focus-toggle" class="theme-toggle" type="button">⛶ Full Screen</button>
      <button id="theme-toggle" class="theme-toggle" type="button"></button>
    </nav>
    <main id="page-content" class="page-content"></main>
  </div>

  <!-- Only visible while data-focus-mode="true" (see styles.css) -- the
       sidebar itself, which normally holds the Full Screen toggle, is
       hidden in that mode, so this floating button is the one way back
       out besides the Esc key. -->
  <button id="focus-exit" class="focus-exit-btn" type="button" title="Exit full screen (Esc)">✕ Exit Full Screen</button>

  <script type="module" src="app.js"></script>
</body>
</html>

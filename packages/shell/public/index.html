<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ambient IT Dashboard</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Applies a saved light/dark choice before the stylesheet paints, so a
       user who's picked a theme different from their OS setting doesn't see
       a flash of the wrong one on load. Inline and synchronous (not part of
       app.js, which is a deferred module) is what makes that timing work. -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('dashboard.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
        // Same flash-avoidance reasoning as the theme read above -- applied
        // to <html> (available immediately, before <body> is even parsed),
        // not .sidebar, since that element doesn't exist yet at this point.
        if (localStorage.getItem('dashboard.sidebarCollapsed') === 'true') {
          document.documentElement.setAttribute('data-sidebar-collapsed', 'true');
        }
      } catch (e) {
        // localStorage unavailable (private browsing, storage full, etc.) -- falls back to the OS setting / expanded sidebar.
      }
    })();
  </script>
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <img src="logo.png" alt="Ambient iT" class="sidebar-logo" />
      <div id="server-hostname" class="sidebar-hostname"></div>
      <div class="sidebar-toggle-row">
        <button id="sidebar-toggle" class="sidebar-toggle" type="button"></button>
        <button id="sidebar-pin-toggle" class="sidebar-toggle sidebar-pin-toggle" type="button">📌</button>
        <button id="sidebar-refresh" class="sidebar-toggle" type="button" title="Refresh the whole dashboard" aria-label="Refresh the whole dashboard">↻</button>
        <!-- Admin-only -- hidden by default, shown by app.js once the
             signed-in account is confirmed to be the dashboard admin.
             Lets Amber preview the sidebar exactly as a regular user
             would see it (hidden items removed, no drag/hide/rename
             affordances) without actually signing in as anyone else. -->
        <button id="preview-user-toggle" class="sidebar-toggle" type="button" title="Preview as a regular user (hides admin-only items)" aria-label="Preview as a regular user" hidden>👁</button>
      </div>
      <ul id="nav-list" class="nav-list"></ul>
      <div id="user-info" class="user-info"></div>
      <button id="focus-toggle" class="theme-toggle" type="button">⛶ Full Screen</button>
      <button id="theme-toggle" class="theme-toggle" type="button"></button>
    </nav>
    <main id="page-content" class="page-content"></main>
  </div>

  <!-- Only visible while data-focus-mode="true" (see styles.css) -- the
       sidebar itself, which normally holds the Full Screen toggle, is
       hidden in that mode, so this floating button is the one way back
       out besides the Esc key. -->
  <button id="focus-exit" class="focus-exit-btn" type="button" title="Exit full screen (Esc)">✕ Exit Full Screen</button>

  <!-- Only shown while a Rotate cycle is actually running (app.js's own
       rotationActive -- toggled via plain .hidden, not a CSS attribute
       selector like focus-exit above, since there's no HTML attribute
       reflecting that state). Present on every page, bottom-centre,
       specifically so it's still reachable in Full Screen mode -- the
       sidebar's own play/pause button (on the Rotate category header) is
       hidden along with the rest of the sidebar there.

       Back/Forward skip to the previous/next Rotate page immediately
       (bypassing however much of the current page's own timer is left)
       WITHOUT stopping rotation -- it keeps auto-advancing from wherever
       they land, same as if the timer itself had fired there (or stays
       paused there, if Pause is currently on -- see app.js's own
       scheduleNextRotation()).

       Pause (blue, flips to Play/green while paused -- app.js's own
       renderRotateControls()) only stops the AUTO-ADVANCE TIMER --
       rotation stays "on" the whole time: still full screen, sidebar
       still unpinned, this whole control row stays visible. Stop (red)
       is the real exit, same as this row's own old single button used to
       be -- leaves full screen, restores the sidebar pin, hides this
       row. -->
  <div id="rotate-controls" class="rotate-controls" hidden>
    <button id="rotate-back-btn" class="rotate-control-btn" type="button" title="Previous page (stays in Rotate)">⏮</button>
    <button id="rotate-pause-btn" class="rotate-control-btn" type="button" title="Pause rotating">⏸</button>
    <button id="rotate-stop-btn" class="rotate-control-btn rotate-control-btn--stop" type="button" title="Stop rotating">⏹</button>
    <button id="rotate-forward-btn" class="rotate-control-btn" type="button" title="Next page (stays in Rotate)">⏭</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
